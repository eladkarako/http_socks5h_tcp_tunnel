[package]
name = "http_socks5h_tcp_tunnel"
version = "26.10.6"
edition = "2024"
authors = ["Elad Karako <eladkarako@gmail.com>"]
categories = ["command-line-utilities"]
description = "a tiny HTTP-SOCKS5h TCP tunnel."
documentation = "https://github.com/eladkarako/http_socks5h_tcp_tunnel#readme"
homepage = "https://github.com/eladkarako/http_socks5h_tcp_tunnel"
keywords = ["http-proxy", "socks5h", "tunnel", "cli"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/eladkarako/http_socks5h_tcp_tunnel"
rust-version = "1.93.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
num_cpus = { version = "1.17.0" }

[target.'cfg(all(not(target_os = "windows"), not(target_os = "android")))'.dependencies]
jemallocator = "0.5.4"


[build-dependencies]
toml = "1.1.6"                                                      # TOML parsing for build scripts
winres = "0.1.12"                                                   # Windows resource file handling (exe metadata, icons, version info)

[profile.release]
codegen-units = 1                                                   # Single unit for better optimization and smaller binary size
debug = false                                                       # Strip debug symbols for smaller binary
incremental = false                                                 # Disable incremental compilation for cleaner builds
lto = true                                                          # Link-time optimization for better performance
opt-level = "z"                                                     # Maximum optimization for binary size (prioritize size over speed)
panic = "abort"                                                     # Replace unwinding with abort (smaller binary, faster panics)
rpath = false                                                       # Don't embed runtime library search paths
strip = true                                                        # Strip all symbols from final binary
