#-------------------------------------- cd ~ && mkdir toolchains || cd toolchains && wget "https://github.com/cross-tools/musl-cross/releases/latest/download/armv7-unknown-linux-musleabihf.tar.xz" && tar -xJf armv7-unknown-linux-musleabihf.tar.xz && rm armv7-unknown-linux-musleabihf.tar.xz
[target.armv7-unknown-linux-musleabihf]
