#-------------------------------------- cd ~ && mkdir toolchains || cd toolchains && wget "https://github.com/cross-tools/musl-cross/releases/latest/download/aarch64-unknown-linux-musl.tar.xz" && tar -xJf aarch64-unknown-linux-musl.tar.xz && rm aarch64-unknown-linux-musl.tar.xz
[target.aarch64-unknown-linux-musl]
