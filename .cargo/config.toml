# @formatter:off


#-------------------------------------- those are installed via apt (and are availble in PATH).
[target.x86_64-unknown-linux-gnu]
linker = "gcc"

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[target.aarch64-unknown-linux-gnu]
linker = 'aarch64-linux-gnu-gcc'

[target.armv7-unknown-linux-gnueabihf]
linker = 'arm-linux-gnueabihf-gcc'

[target.powerpc64-unknown-linux-gnu]
linker = 'powerpc64-linux-gnu-gcc'

[target.powerpc64le-unknown-linux-gnu]
linker = 'powerpc64le-linux-gnu-gcc'

[target.powerpc-unknown-linux-gnu]
linker = 'powerpc-linux-gnu-gcc'



#------------------------------------------- cd ~ && mkdir toolchains || wget "https://dl.google.com/android/repository/android-ndk-r30-linux.zip" && unzip android-ndk-r30-linux.zip &&  rm android-ndk-r30-linux.zip
[target.x86_64-linux-android]
